<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - QuizGame ISUTJ</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                        "error": "#ba1a1a",

                        "inverse-primary": "#dbb8ff",

                        "background": "#f8f9ff",

                        "secondary-fixed": "#ffdf95",

                        "primary-container": "#461f70",
                        "surface-variant": "#d3e4fe",

                    "borderRadius": {

                    "fontFamily": {

                        "score-display": ["24px", { "lineHeight": "32px", "fontWeight": "800" }]

                }
            }
        }

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .icon-fill {
            font-variation-settings: 'FILL' 1;
        }
        
        /* Glow Accents */
        .glow-accent {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(70,31,112,0.05) 0%, rgba(70,31,112,0) 70%);
            border-radius: 50%;
            pointer-events: none;
        }
        
        .glow-accent-1 { top: -100px; left: -100px; }
        .glow-accent-2 { bottom: -150px; right: -50px; background: radial-gradient(circle, rgba(255,199,10,0.08) 0%, rgba(255,199,10,0) 70%); }
        
        /* Participant Primary Button */
        .btn-participant-primary {
            background: #461f70;
            color: #ffffff;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(70, 31, 112, 0.25);
        }
        .btn-participant-primary:active {
            transform: scale(0.98);
            box-shadow: 0 2px 8px rgba(70, 31, 112, 0.35);
        }
        
        /* Light Input */
        .input-light {
            background: #f8f9ff;
            border: 1px solid #cdc3d1;
            color: #0b1c30;
        }
        .input-light:focus {
            background: #ffffff;
            border-color: #461f70;
            box-shadow: 0 0 0 2px rgba(70, 31, 112, 0.15);
            outline: none;
        }
        .input-light::placeholder {
            color: #7c7481;
        }
    </style>
</head>
<body class="bg-white min-h-screen text-on-surface font-body-md flex items-center justify-center p-container-margin md:p-xl antialiased selection:bg-primary-container selection:text-white">
<!-- Decorative Glow Elements -->
<div class="glow-accent glow-accent-1"></div>
<div class="glow-accent glow-accent-2"></div>
<main class="w-full max-w-md relative z-10">
<!-- Logo Area -->
<div class="flex flex-col items-center justify-center mb-xl">
<img alt="Universitario Japon Logo" class="h-24 md:h-32 mb-lg object-contain drop-shadow-sm" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC9Eubbqy11E76BuoWtx1tk6h8JWXHorEXNbKQodkjCTOeV4no7CBUk8BgH-lE6XGXwyzjU06u4vcSB0NCluBsJtomK7draFC9UQWoiEegaRhQNa92DRJUR3GVkcrmtMJqfs2Nu6A5U-xQcSWOeoHoBM5hNqRZ1gCW8GrUHYztmxR8Wxj3InjnP3bzXKQ0dyyiC2-BxqAoFrDtf8r5cZ9uM_Ik6rc_anw8LmMQAIfT1kax9Qjc5QJWHTBMtKOw6L5LA2VVTeDh6JA6n"/>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-center text-primary-container mb-sm tracking-tight drop-shadow-sm">
                ¡Bienvenido, Campeón!
            </h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center opacity-90">
                Prepárate para demostrar tus conocimientos.
            </p>
</div>
<!-- Login Form Card -->
<div class="bg-white border border-outline-variant/30 rounded-xl p-lg md:p-xl shadow-[0_8px_32px_rgba(0,0,0,0.08)]">
<form action="#" class="space-y-lg" method="POST">
<!-- Email Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-sm" for="email">Correo Institucional</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline-variant">mail</span>
</div>
<input class="input-light w-full pl-12 pr-4 py-4 rounded-lg font-body-md text-body-md transition-all duration-300" id="email" name="email" placeholder="tu.correo@ujapon.edu.ec" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div>
<div class="flex justify-between items-center mb-sm">
<label class="block font-label-md text-label-md text-on-surface-variant" for="password">Contraseña de Juego</label>
<a class="font-label-md text-label-md text-primary-container hover:text-primary transition-colors" href="#">¿Olvidaste?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline-variant">lock</span>
</div>
<input class="input-light w-full pl-12 pr-12 py-4 rounded-lg font-body-md text-body-md transition-all duration-300" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-4 flex items-center text-outline-variant hover:text-primary-container transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center">
<input class="h-5 w-5 rounded border-outline-variant bg-white text-primary-container focus:ring-primary-container" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-3 block font-body-md text-body-md text-on-surface-variant" for="remember-me">
                        Mantener sesión activa
                    </label>
</div>
<!-- Submit Button -->
<div class="pt-sm">
<button class="btn-participant-primary w-full flex justify-center items-center py-4 px-6 border border-transparent rounded-lg font-title-md text-title-md shadow-lg" type="submit">
                        Iniciar Sesión
                        <span class="material-symbols-outlined ml-2 icon-fill">sports_esports</span>
</button>
</div>
</form>
<!-- Registration Link -->
<div class="mt-lg text-center border-t border-outline-variant/20 pt-lg">
<p class="font-body-md text-body-md text-on-surface-variant">
                    ¿Es tu primera vez aquí? 
                    <a class="font-label-md text-label-md text-[#ffc708] hover:text-[#e5b307] transition-colors ml-1 border-b border-transparent hover:border-[#e5b307] pb-1 font-bold" href="#">
                        Activa tu cuenta
                    </a>
</p>
</div>
</div>
<!-- Decorative Bottom Elements -->
<div class="mt-xl flex justify-center gap-xs">
<div class="w-2 h-2 rounded-full bg-primary-container"></div>
<div class="w-2 h-2 rounded-full bg-outline-variant/50"></div>
<div class="w-2 h-2 rounded-full bg-outline-variant/50"></div>
</div>
</main>
</body></html>
