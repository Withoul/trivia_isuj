<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Simulating the glowing pulse for timer */
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 10px rgba(70, 31, 112, 0.5); }
            50% { box-shadow: 0 0 25px rgba(255, 199, 10, 0.8); }
        }
        .timer-glow {
            animation: pulse-glow 2s infinite;
        }

        /* Floating points animation simulation */
        @keyframes float-up {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-40px) scale(1.2); }
        }
        .float-animation {
            animation: float-up 1.5s ease-out forwards;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-surface min-h-screen font-body-md text-on-surface antialiased overflow-x-hidden">
<!-- TopAppBar -->
<header class="fixed top-0 w-full h-16 z-50 bg-white/90 backdrop-blur-md shadow-sm border-b border-outline-variant flex items-center justify-between px-container-margin w-full">
<div class="flex items-center gap-2 text-primary-container hover:opacity-80 transition-transform active:scale-95 cursor-pointer">
<span class="material-symbols-outlined text-[28px]" data-icon="school">school</span>
<span class="font-display-lg text-title-md tracking-tight">QuizGame ISUTJ</span>
</div>
<div class="flex items-center gap-1 bg-surface-container-low px-3 py-1.5 rounded-full border border-outline-variant text-on-surface hover:opacity-80 transition-transform active:scale-95 cursor-pointer">
<span class="font-label-md text-label-md font-bold">1,250</span>
<span class="text-lg">💎</span>
</div>
</header>
<!-- Main Content Area - Active Quiz -->
<main class="pt-[88px] pb-32 px-container-margin max-w-lg mx-auto w-full flex flex-col gap-6 relative">
<!-- Floating +50 Indicator (Simulated visual feedback) -->
<div class="absolute right-8 top-24 z-10 font-score-display text-score-display text-secondary-container drop-shadow-[0_0_10px_rgba(255,199,10,0.8)] float-animation pointer-events-none">
            +50
        </div>
<!-- Top Status Bar (Timer & Streak) -->
<div class="flex justify-between items-center w-full">
<!-- Streak Indicator -->
<div class="flex items-center gap-1.5 bg-surface-container-low border border-outline-variant rounded-full px-4 py-1.5 backdrop-blur-md">
<span class="material-symbols-outlined text-streak-orange fill text-[20px]">local_fire_department</span>
<span class="font-label-md text-label-md text-on-surface font-bold tracking-wider">Racha x5</span>
</div>
<!-- Timer Indicator -->
<div class="w-14 h-14 rounded-full bg-white border-2 border-secondary-container flex items-center justify-center timer-glow text-primary-container font-score-display text-score-display font-black">
                12
            </div>
</div>
<!-- Question Area -->
<div class="mt-4 mb-2">
<div class="inline-block px-3 py-1 bg-primary-container/10 text-primary-container rounded-md font-label-md text-label-md mb-3 text-sm border border-primary-container/20">
                Pregunta 4 / 10
            </div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface font-extrabold leading-tight text-center md:text-left drop-shadow-sm">
                ¿Cuál es el lenguaje de programación principal para desarrollo Android nativo?
            </h1>
</div>
<!-- Progress Bar -->
<div class="w-full h-3 bg-surface-container-high rounded-full overflow-hidden mb-2 relative">
<!-- Simulated gradient living progress -->
<div class="absolute top-0 left-0 h-full w-[40%] bg-gradient-to-r from-[#ffc708] to-[#4edea3] rounded-full shadow-[0_0_10px_rgba(70,31,112,0.3)]"></div>
</div>
<!-- Options Grid -->
<div class="grid grid-cols-1 gap-4 mt-2">
<!-- Option 1 (Default Glass State) -->
<button class="w-full min-h-[72px] bg-white border border-outline-variant rounded-xl px-5 py-4 flex items-center justify-between text-left hover:bg-surface-container-low transition-all duration-200 active:scale-95 group shadow-sm">
<span class="font-title-md text-title-md text-on-surface group-hover:text-primary-container transition-colors">Swift</span>
<div class="w-8 h-8 rounded-full border-2 border-outline-variant flex items-center justify-center text-on-surface-variant group-hover:border-primary-container transition-colors">
<span class="font-label-md text-label-md font-bold">A</span>
</div>
</button>
<!-- Option 2 (Selected/Active State with Glow) -->
<button class="w-full min-h-[72px] bg-primary-container/10 border-2 border-primary-container rounded-xl px-5 py-4 flex items-center justify-between text-left shadow-[0_0_15px_rgba(70,31,112,0.2)] transform scale-[1.02] transition-all duration-200">
<span class="font-title-md text-title-md text-primary-container font-bold">Kotlin</span>
<div class="w-8 h-8 rounded-full bg-primary-container flex items-center justify-center text-white">
<span class="font-label-md text-label-md font-bold">B</span>
</div>
</button>
<!-- Option 3 (Default Glass State) -->
<button class="w-full min-h-[72px] bg-white border border-outline-variant rounded-xl px-5 py-4 flex items-center justify-between text-left hover:bg-surface-container-low transition-all duration-200 active:scale-95 group shadow-sm">
<span class="font-title-md text-title-md text-on-surface group-hover:text-primary-container transition-colors">JavaScript</span>
<div class="w-8 h-8 rounded-full border-2 border-outline-variant flex items-center justify-center text-on-surface-variant group-hover:border-primary-container transition-colors">
<span class="font-label-md text-label-md font-bold">C</span>
</div>
</button>
<!-- Option 4 (Default Glass State) -->
<button class="w-full min-h-[72px] bg-white border border-outline-variant rounded-xl px-5 py-4 flex items-center justify-between text-left hover:bg-surface-container-low transition-all duration-200 active:scale-95 group shadow-sm">
<span class="font-title-md text-title-md text-on-surface group-hover:text-primary-container transition-colors">C#</span>
<div class="w-8 h-8 rounded-full border-2 border-outline-variant flex items-center justify-center text-on-surface-variant group-hover:border-primary-container transition-colors">
<span class="font-label-md text-label-md font-bold">D</span>
</div>
</button>
</div>
</main>
<!-- Navigation excluded because this is a focused, transactional "Active Quiz" task flow -->
</body></html>
