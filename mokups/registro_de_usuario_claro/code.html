<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>QuizGame ISUTJ - Registration</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary": "#ffffff",
                        "on-secondary-fixed-variant": "#594400",
                        "surface-container-lowest": "#ffffff",
                        "on-primary-fixed": "#2b0052",
                        "on-tertiary-fixed-variant": "#005236",
                        "outline-variant": "#cdc3d1",
                        "outline": "#7c7481",
                        "inverse-on-surface": "#eaf1ff",
                        "on-secondary-fixed": "#251a00",
                        "tertiary": "#002517",
                        "on-secondary": "#ffffff",
                        "error": "#ba1a1a",
                        "tertiary-container": "#003d28",
                        "inverse-surface": "#213145",
                        "tertiary-fixed-dim": "#4edea3",
                        "secondary": "#765b00",
                        "on-primary": "#ffffff",
                        "inverse-primary": "#dbb8ff",
                        "on-error": "#ffffff",
                        "on-surface-variant": "#4b4450",
                        "background": "#f8f9ff",
                        "surface-admin": "#F8FAFC",
                        "surface-dim": "#cbdbf5",
                        "on-tertiary-container": "#00b37c",
                        "surface-container-high": "#dce9ff",
                        "on-secondary-container": "#6e5400",
                        "surface-tint": "#734c9e",
                        "surface-container-low": "#eff4ff",
                        "surface": "#f8f9ff",
                        "surface-container": "#e5eeff",
                        "secondary-container": "#ffc70a",
                        "on-error-container": "#93000a",
                        "on-tertiary-fixed": "#002113",
                        "on-surface": "#0b1c30",
                        "on-primary-container": "#b48be2",
                        "on-background": "#0b1c30",
                        "secondary-fixed-dim": "#f5bf00",
                        "background-dark": "#1A0B2E",
                        "surface-bright": "#f8f9ff",
                        "surface-container-highest": "#d3e4fe",
                        "primary-fixed": "#efdbff",
                        "glass-fill": "rgba(255, 255, 255, 0.08)",
                        "secondary-fixed": "#ffdf95",
                        "error-container": "#ffdad6",
                        "primary-container": "#461f70",
                        "surface-variant": "#d3e4fe",
                        "primary": "#30015a",
                        "streak-orange": "#F97316",
                        "tertiary-fixed": "#6ffbbe",
                        "primary-fixed-dim": "#dbb8ff",
                        "on-primary-fixed-variant": "#5a3484"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xl": "32px",
                        "md": "16px",
                        "xs": "4px",
                        "gutter": "16px",
                        "container-margin": "20px",
                        "sm": "8px",
                        "base": "4px",
                        "lg": "24px"
                    },
                    "fontFamily": {
                        "display-lg": ["Plus Jakarta Sans"],
                        "label-md": ["Plus Jakarta Sans"],
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "title-md": ["Plus Jakarta Sans"],
                        "headline-lg-mobile": ["Plus Jakarta Sans"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "score-display": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "title-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "700" }],
                        "score-display": ["24px", { "lineHeight": "32px", "fontWeight": "800" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-white min-h-screen font-body-md text-on-surface flex flex-col items-center">
<!-- TopAppBar (Transactional - Hidden Navigation on Registration) -->
<!-- As per instructions, linear/transactional intents like signup suppress the navigation shell, however, the prompt explicitly asks for TopAppBar and BottomNavBar. I will render them but keep them visually appropriate. -->
<header class="fixed top-0 w-full h-16 z-50 bg-white text-primary-container border-b border-outline-variant/50 shadow-sm flex items-center justify-between px-container-margin w-full">
<div class="flex items-center gap-2 text-primary-container">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">school</span>
<h1 class="font-display-lg text-title-md tracking-tight font-bold text-primary-container">QuizGame ISUTJ</h1>
</div>
<div class="flex items-center gap-1 font-score-display text-on-secondary-container bg-secondary-container/20 px-3 py-1 rounded-full border border-secondary-container/30">
<span>1,250</span>
<span>💎</span>
</div>
</header>
<!-- Main Content -->
<main class="w-full max-w-md px-container-margin pt-24 pb-32 flex flex-col items-center justify-center min-h-screen relative z-10">
<!-- Registration Card -->
<div class="w-full bg-white border border-outline-variant/50 rounded-2xl p-6 shadow-md flex flex-col gap-6 relative overflow-hidden">
<!-- Decorative Glow -->
<div class="absolute -top-20 -right-20 w-40 h-40 bg-secondary-container/20 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute -bottom-20 -left-20 w-40 h-40 bg-primary-container/10 rounded-full blur-3xl pointer-events-none"></div>
<div class="text-center flex flex-col gap-2 relative z-10">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface font-bold tracking-tight">Comienza tu camino al éxito</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Regístrate para competir y ganar</p>
</div>
<form class="flex flex-col gap-4 relative z-10 w-full mt-4">
<!-- Full Name -->
<div class="flex flex-col gap-1.5 w-full">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="fullname">Nombre Completo</label>
<div class="relative w-full">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">badge</span>
<input class="w-full h-12 bg-surface border border-outline-variant/50 rounded-xl pl-10 pr-4 text-on-surface font-body-md placeholder-outline focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors" id="fullname" placeholder="Ej. Ana Pérez" type="text"/>
</div>
</div>
<!-- Email -->
<div class="flex flex-col gap-1.5 w-full">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="email">Correo Electrónico</label>
<div class="relative w-full">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full h-12 bg-surface border border-outline-variant/50 rounded-xl pl-10 pr-4 text-on-surface font-body-md placeholder-outline focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors" id="email" placeholder="correo@ejemplo.com" type="email"/>
</div>
</div>
<!-- Career Interest -->
<div class="flex flex-col gap-1.5 w-full">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="career">Carrera de Interés</label>
<div class="relative w-full">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">explore</span>
<select class="w-full h-12 bg-surface border border-outline-variant/50 rounded-xl pl-10 pr-4 text-on-surface font-body-md placeholder-outline focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors appearance-none" id="career">
<option class="text-on-surface bg-surface" value="">Selecciona una carrera</option>
<option class="text-on-surface bg-surface" value="ingenieria">Ingeniería en Sistemas</option>
<option class="text-on-surface bg-surface" value="diseno">Diseño Gráfico</option>
<option class="text-on-surface bg-surface" value="negocios">Administración de Negocios</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-outline pointer-events-none">expand_more</span>
</div>
</div>
<!-- Password -->
<div class="flex flex-col gap-1.5 w-full">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="password">Contraseña</label>
<div class="relative w-full">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full h-12 bg-surface border border-outline-variant/50 rounded-xl pl-10 pr-4 text-on-surface font-body-md placeholder-outline focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Submit Button -->
<button class="w-full mt-6 bg-primary-container border-2 border-secondary-container text-white font-label-md text-label-md py-4 rounded-xl shadow-md hover:shadow-lg transition-all duration-200 flex items-center justify-center gap-2 active:scale-95" type="button">
                    Registrarse
                    <span class="material-symbols-outlined text-secondary-container">arrow_forward</span>
</button>
</form>
<div class="text-center mt-4 relative z-10">
<p class="font-body-md text-[14px] text-on-surface-variant">¿Ya tienes una cuenta? <a class="text-primary-container font-semibold hover:underline" href="#">Inicia sesión</a></p>
</div>
</div>
</main>
<!-- BottomNavBar (Hidden on MD, Profile is closest intent for registration/user management, but it's a signup screen. I will highlight profile as a fallback if forced to render) -->
<nav class="md:hidden fixed bottom-0 w-full h-16 z-50 rounded-t-xl bg-white border-t border-outline-variant/50 shadow-lg flex justify-around items-center px-4 pb-safe">
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary-container transition-all duration-300 active:scale-90 w-16" href="#">
<span class="material-symbols-outlined text-[24px]">quiz</span>
<span class="font-label-md text-[10px] mt-1">Quizzes</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary-container transition-all duration-300 active:scale-90 w-16" href="#">
<span class="material-symbols-outlined text-[24px]">leaderboard</span>
<span class="font-label-md text-[10px] mt-1">Rankings</span>
</a>
<!-- Highlighted as closest to user management / signup intent -->
<a class="flex flex-col items-center justify-center bg-primary-container text-secondary-container rounded-xl px-4 py-1 shadow-md transition-all duration-300 active:scale-90" href="#">
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="font-label-md text-[10px] mt-1 font-semibold">Profile</span>
</a>
</nav>
</body></html>
